<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timetable</title>
</head>
<body>
    <h1>student's timetable</h1>

    <!-- timetable -->
     <table border="2px">
        <thead bgcolor="yellow">
            <tr>
                <td rowspan="2" style="text-align: center;"> DAY</td>
                <td colspan="4" style="text-align: center;"> TIME </td>
            </tr>
            <tr>
                <td>8:00am - 10:00am </td>
                <td>10:00am - 12:00pm</td>
                <td>12:00pm - 02:00pm</td>
                <td>02:00pm - 04:00pm</td>
            </tr>
        </thead>
        <tbody>
           <tr>
            <td  bgcolor="green" style="color: bisque;">MONDAY</td>
            <td>MATH</td>
            <td>PHYSICS</td>
            <td rowspan="5" style="text-align: center;">B <br> R <br> E <br> A <br> K</td>
            <td>CHEMISTRY</td>
           </tr>
           <tr>
            <td bgcolor="green" style="color: bisque;">TUESDAY</td>
            <td colspan="2" style="text-align: center;">CHEMISTRY</td>
            <td>PHYSICS</td>
           </tr>
           <tr>
            <td bgcolor="green" style="color: bisque;">WEDNESDAY</td>
            <td>MATHS</td>
            <td>CHEMISTRY</td>
            <td>PHYSICS</td>
           </tr>
           <tr>
            <td bgcolor="green" style="color: bisque;">THURSDAY</td>
            <td>PHYSICS</td>
            <td>MATH</td>
            <td>CHEMISTRY</td>
           </tr>
           <tr>
            <td bgcolor="green" style="color: bisque;">FRIDAY</td>
            <td colspan="2" style="text-align: center;">MATH</td>
            <td>SPORTS & GAMES</td>
           </tr>
        </tbody>
     </table>







</body>
</html>
